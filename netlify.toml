# Netlify is the production host for this app. All server-only secrets
# (SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY, AWS_*, STRIPE_*,
# RESEND_API_KEY, INNGEST_*, INBOUND_EMAIL_*, SENTRY_AUTH_TOKEN, etc.) MUST
# be configured in the Netlify dashboard under Site settings → Environment
# variables, scoped to the `production` and `deploy-preview` contexts.
#
# This file deliberately does NOT default those secrets to placeholder
# strings — `src/env.ts` rejects placeholder values at startup, and a
# misconfigured dashboard should fail loudly at build/runtime instead of
# silently shipping broken SDK clients to production. See `assertNoPlaceholderSecrets`.
#
# `SKIP_ENV_VALIDATION=1` only takes effect on Netlify for non-production
# contexts (deploy-preview, branch-deploy). Production builds always run
# the full `@t3-oss/env-nextjs` schema. Local builds outside Netlify still
# honor the flag for inspection workflows.

[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  SKIP_ENV_VALIDATION = "1"

  # Public client-side values — these are bundled into the browser bundle
  # at build time and are NOT secrets. They live here so deploy-preview
  # builds work without dashboard config.
  NEXT_PUBLIC_SUPABASE_URL = "https://sdtfkyrpsigqtsjgovxe.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkdGZreXJwc2lncXRzamdvdnhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMjg2ODIsImV4cCI6MjA5MzkwNDY4Mn0.tuB6H0HhVRJIAQqyDFZS_ed7wURYTiok5GKfUMd_qCc"
