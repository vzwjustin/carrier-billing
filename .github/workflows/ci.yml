name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Diagnostics
        run: |
          echo "=== Versions ==="
          node --version
          pnpm --version
          echo "=== package.json packageManager ==="
          node -e "console.log(require('./package.json').packageManager)"
          echo "=== pnpm-lock.yaml head ==="
          head -5 pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log
          echo "=== install exit ok ==="

      - name: Lint
        run: pnpm lint 2>&1 | tee /tmp/lint.log

      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Unit tests
        run: pnpm test 2>&1 | tee /tmp/test.log

      - name: Build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # Sentry sourcemap upload (no-ops when these secrets are absent — e.g.
          # forked PRs). Required for release builds on main.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: pnpm build 2>&1 | tee /tmp/build.log

      - name: Print logs on failure
        if: failure()
        run: |
          for f in install lint typecheck test build; do
            if [ -f "/tmp/$f.log" ]; then
              echo "::group::$f.log (last 200 lines)"
              tail -200 "/tmp/$f.log" || true
              echo "::endgroup::"
            fi
          done

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Post failure log to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not installed; skipping PR comment."
            exit 0
          fi
          {
            echo '### CI failure log (truncated)'
            echo
            for f in install lint typecheck test build; do
              if [ -f "/tmp/$f.log" ]; then
                echo "<details><summary>$f.log (last 80 lines)</summary>"
                echo
                echo '```'
                tail -80 "/tmp/$f.log" || true
                echo '```'
                echo '</details>'
                echo
              fi
            done
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md || true
