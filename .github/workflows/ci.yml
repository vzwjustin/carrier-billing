name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (env probe)
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          echo "Runner is alive."
          echo "OS: $(uname -a)"
          echo "Node: $(node --version || echo 'no node')"
          echo "GH ref: $GITHUB_REF"
          echo "GH event: $GITHUB_EVENT_NAME"
          echo "GH actor: $GITHUB_ACTOR"

  quality:
    name: Lint, typecheck, test, build
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          SKIP_ENV_VALIDATION: '1'
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: pnpm build
